name: flutter_trainee_2025
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.7.0


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  file_picker: ^9.2.1
  shared_preferences: ^2.5.3
  hive: ^2.2.3
  hive_flutter:
  sqflite:
  get: ^4.7.2
  dio: ^5.8.0+1
  http: ^1.3.0
  http_interceptor: ^2.0.0
  image_picker: ^1.1.2
  dio_cache_interceptor: ^4.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/

  fonts:
    - family: playwrite
      fonts:
        - asset: assets/fonts/playwrite.ttf
